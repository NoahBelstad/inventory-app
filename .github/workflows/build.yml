name: "Publish"

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Step 1: Standard Tauri release (creates normal installers on GitHub Releases)
      - name: Publish Installers to GitHub Release
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: inventory-app-v__VERSION__
          releaseName: 'Inventory App v__VERSION__'
          releaseBody: 'Inventory app release'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'ubuntu-22.04' && '--bundles deb,appimage' || '--bundles nsis,msi' }}

      # Step 2: Create zip containing executable + unblock script and upload as Artifact (Windows only)
      - name: Package Portable Zip with Unblock Script
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path portable_release -Force
          
          # Copy the compiled application binary
          Copy-Item "src-tauri\target\release\inventory-app.exe" -Destination "portable_release\"

          # Create the unblock.bat file inside the directory
          $batContent = @"
          @echo off
          echo Removing security warnings for files in this folder...
          powershell -Command "Get-ChildItem -Path '%~dp0' -File | Unblock-File"
          echo Done!
          pause
          "@
          Set-Content -Path "portable_release\unblock.bat" -Value $batContent -Encoding ASCII

          # Zip the folder contents
          Compress-Archive -Path "portable_release\*" -DestinationPath "inventory-app-portable-windows.zip"

      - name: Upload Portable Zip Artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: inventory-app-portable-windows
          path: inventory-app-portable-windows.zip
